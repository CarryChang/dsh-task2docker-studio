# dsh-task2docker-studio bundle patch.
# Mounts one plugin that contributes the task-to-runner dispatch methodology skill and registers the
# t2d_register_runner / t2d_list_runners / t2d_remove_runner / t2d_run / t2d_status / t2d_logs /
# t2d_stop tools. A runner is any SSH-reachable machine the user controls; runs go into a Docker
# container when an image is set, or background on the host otherwise. Registered runners and the job
# ledger persist under stateDir. Passwords are stored only as pointers (an env var name or a 0600 file
# path) and are never logged or returned.

- insert:
    - id: task2docker
      name: 'dsh-task2docker-studio'
      config:
        stateDir: ''            # default ~/.dsh-task2docker
        sshTimeoutSec: 60
        # Optional runners registered on load, so the profile is ready to use:
        runners: []
